# Tracked report-generation defaults.
# Put machine-specific or personal overrides in config.local.toml.

[paths]
pics_dir = "pics"
collages_dir = "Collages"
template_file = "template.docx"

[images]
supported_extensions = [".jpg", ".jpeg", ".png", ".webp"]

[collage]
images_per_row = 2
count = 4
cell_size = [900, 900]
background_color = [255, 255, 255]
padding = 1
jpeg_quality = 92

[compression]
target_size_ratio = 0.5
min_jpeg_quality = 20
max_jpeg_quality = 95
optimize = true
progressive = true
subsampling = 0
dry_run = false

[report]
title = "Cleaners Report"
filename_prefix = "cleaners_report_"
folder_date_format = "%Y%m%d"
filename_date_format = "%d%b%Y"
heading_month_year_format = "%b %Y"
max_image_width_cm = 12
max_image_height_cm = 22
page_width_cm = 21
page_height_cm = 29.7

[pdf]
word_format_pdf = 17
word_optimize_for = 1
ghostscript_candidates = ["gswin64c", "gswin32c", "gs"]
ghostscript_compatibility_level = "1.4"
ghostscript_pdf_settings = "/screen"
compress_after_export = true
delete_docx_after_success = true

[pipeline]
scripts = [
    "collage_pictures.py",
    "compress_pics.py",
    "word_docx_gen.py",
    "docx_to_pdf.py",
]
delete_collages_before_run = true
delete_collages_after_run = true
